# Ejemplo nginx: reverse proxy al visualizador GNEIS (contenedor en 8280).
# Permite embeber la app en iframe desde cualquier dominio.
#
# Instalación orientativa:
#   cp deploy/nginx/gneis-visualizador.conf /etc/nginx/conf.d/
#   nginx -t && systemctl reload nginx
#
# Ajustar server_name y upstream según el entorno.

upstream gneis_visualizador {
    server 127.0.0.1:8280;
    keepalive 32;
}

server {
    listen 80;
    server_name visor.ejemplo.es;

    # Tamaño de peticiones (ajustar si hace falta)
    client_max_body_size 10m;

    location /gneis {
        proxy_pass http://gneis_visualizador;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # Iframe cross-domain: permitir cualquier sitio padre.
        # No usar X-Frame-Options DENY/SAMEORIGIN en esta location.
        add_header Content-Security-Policy "frame-ancestors *" always;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
